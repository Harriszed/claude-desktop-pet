<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -40 240 220" width="240" height="220" class="cm-root" data-state="compacting" role="img" aria-label="Compacting" shape-rendering="crispEdges"><title>Compacting</title><style>.cm-root[data-state="compacting"] .cm-frame { opacity: 0; }
.cm-root[data-state="compacting"] .cm-frame-0 { opacity: 1; }
.cm-root[data-state="compacting"] .cm-frame-0 { animation: cm-compacting-0 calc(2.8s * var(--cm-tempo, 1)) steps(1, end) var(--cm-repeat, infinite) both; }
@keyframes cm-compacting-0 { 0% { opacity: 1; } 37.5% { opacity: 0; } 100% { opacity: 0; } }
.cm-root[data-state="compacting"] .cm-frame-1 { animation: cm-compacting-1 calc(2.8s * var(--cm-tempo, 1)) steps(1, end) var(--cm-repeat, infinite) both; }
@keyframes cm-compacting-1 { 0% { opacity: 0; } 37.5% { opacity: 1; } 75% { opacity: 0; } 100% { opacity: 0; } }
.cm-root[data-state="compacting"] .cm-frame-2 { animation: cm-compacting-2 calc(2.8s * var(--cm-tempo, 1)) steps(1, end) var(--cm-repeat, infinite) both; }
@keyframes cm-compacting-2 { 0% { opacity: 0; } 75% { opacity: 1; } 100% { opacity: 1; } }
.cm-root[data-paused="true"] .cm-frame { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .cm-root[data-state="compacting"] .cm-frame { animation: none !important; } }
