<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -40 240 220" width="240" height="220" class="cm-root" data-state="waiting-for-you" role="img" aria-label="Waiting for you" shape-rendering="crispEdges"><title>Waiting for you</title><style>.cm-root[data-state="waiting-for-you"] .cm-frame { opacity: 0; }
.cm-root[data-state="waiting-for-you"] .cm-frame-0 { opacity: 1; }
.cm-root[data-state="waiting-for-you"] .cm-frame-0 { animation: cm-waiting-for-you-0 calc(4s * var(--cm-tempo, 1)) steps(1, end) var(--cm-repeat, infinite) both; }
@keyframes cm-waiting-for-you-0 { 0% { opacity: 1; } 50% { opacity: 0; } 62.5% { opacity: 1; } 100% { opacity: 1; } }
.cm-root[data-state="waiting-for-you"] .cm-frame-1 { animation: cm-waiting-for-you-1 calc(4s * var(--cm-tempo, 1)) steps(1, end) var(--cm-repeat, infinite) both; }
@keyframes cm-waiting-for-you-1 { 0% { opacity: 0; } 50% { opacity: 1; } 62.5% { opacity: 0; } 100% { opacity: 0; } }
.cm-root[data-paused="true"] .cm-frame { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .cm-root[data-state="waiting-for-you"] .cm-frame { animation: none !important; } }
