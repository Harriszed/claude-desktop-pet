<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -40 240 220" width="240" height="220" class="cm-root" data-state="error" role="img" aria-label="Error" shape-rendering="crispEdges"><title>Error</title><style>.cm-root[data-state="error"] .cm-frame { opacity: 0; }
.cm-root[data-state="error"] .cm-frame-0 { opacity: 1; }
.cm-root[data-state="error"] .cm-frame-0 { animation: cm-error-0 calc(3.2s * var(--cm-tempo, 1)) steps(1, end) var(--cm-repeat, infinite) both; }
@keyframes cm-error-0 { 0% { opacity: 1; } 5% { opacity: 0; } 16.25% { opacity: 1; } 100% { opacity: 1; } }
.cm-root[data-state="error"] .cm-frame-1 { animation: cm-error-1 calc(3.2s * var(--cm-tempo, 1)) steps(1, end) var(--cm-repeat, infinite) both; }
