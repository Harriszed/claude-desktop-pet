<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -40 240 220" width="240" height="220" class="cm-root" data-state="server-running" role="img" aria-label="Server running" shape-rendering="crispEdges"><title>Server running</title><style>.cm-root[data-state="server-running"] .cm-frame { opacity: 0; }
.cm-root[data-state="server-running"] .cm-frame-0 { opacity: 1; }
.cm-root[data-state="server-running"] .cm-frame-0 { animation: cm-server-running-0 calc(4s * var(--cm-tempo, 1)) steps(1, end) var(--cm-repeat, infinite) both; }
@keyframes cm-server-running-0 { 0% { opacity: 1; } 12.5% { opacity: 0; } 37.5% { opacity: 1; } 50% { opacity: 0; } 75% { opacity: 1; } 87.5% { opacity: 0; } 100% { opacity: 0; } }
.cm-root[data-state="server-running"] .cm-frame-1 { animation: cm-server-running-1 calc(4s * var(--cm-tempo, 1)) steps(1, end) var(--cm-repeat, infinite) both; }
@keyframes cm-server-running-1 { 0% { opacity: 0; } 12.5% { opacity: 1; } 25% { opacity: 0; } 87.5% { opacity: 1; } 100% { opacity: 1; } }
.cm-root[data-state="server-running"] .cm-frame-2 { animation: cm-server-running-2 calc(4s * var(--cm-tempo, 1)) steps(1, end) var(--cm-repeat, infinite) both; }
@keyframes cm-server-running-2 { 0% { opacity: 0; } 25% { opacity: 1; } 37.5% { opacity: 0; } 62.5% { opacity: 1; } 75% { opacity: 0; } 100% { opacity: 0; } }
.cm-root[data-state="server-running"] .cm-frame-3 { animation: cm-server-running-3 calc(4s * var(--cm-tempo, 1)) steps(1, end) var(--cm-repeat, infinite) both; }
@keyframes cm-server-running-3 { 0% { opacity: 0; } 50% { opacity: 1; } 62.5% { opacity: 0; } 100% { opacity: 0; } }
.cm-root[data-paused="true"] .cm-frame { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .cm-root[data-state="server-running"] .cm-frame { animation: none !important; } }
