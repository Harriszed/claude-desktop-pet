<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -40 240 220" width="240" height="220" class="cm-root" data-state="plan-progress" role="img" aria-label="Plan progress" shape-rendering="crispEdges"><title>Plan progress</title><style>.cm-root[data-state="plan-progress"] .cm-frame { opacity: 0; }
.cm-root[data-state="plan-progress"] .cm-frame-0 { opacity: 1; }
.cm-root[data-state="plan-progress"] .cm-frame-0 { animation: cm-plan-progress-0 calc(3.2s * var(--cm-tempo, 1)) steps(1, end) var(--cm-repeat, infinite) both; }
