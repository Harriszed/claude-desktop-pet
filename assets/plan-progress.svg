@keyframes cm-plan-progress-2 { 0% { opacity: 0; } 50% { opacity: 1; } 75% { opacity: 0; } 100% { opacity: 0; } }
.cm-root[data-state="plan-progress"] .cm-frame-3 { animation: cm-plan-progress-3 calc(3.2s * var(--cm-tempo, 1)) steps(1, end) var(--cm-repeat, infinite) both; }
@keyframes cm-plan-progress-3 { 0% { opacity: 0; } 75% { opacity: 1; } 100% { opacity: 1; } }
.cm-root[data-paused="true"] .cm-frame { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .cm-root[data-state="plan-progress"] .cm-frame { animation: none !important; } }
