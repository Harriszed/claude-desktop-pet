@keyframes cm-typing-3 { 0% { opacity: 0; } 62.5% { opacity: 1; } 75% { opacity: 0; } 100% { opacity: 0; } }
.cm-root[data-paused="true"] .cm-frame { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .cm-root[data-state="typing"] .cm-frame { animation: none !important; } }
