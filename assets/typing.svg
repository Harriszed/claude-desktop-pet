<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -40 240 220" width="240" height="220" class="cm-root" data-state="typing" role="img" aria-label="You're typing" shape-rendering="crispEdges"><title>You're typing</title><style>.cm-root[data-state="typing"] .cm-frame { opacity: 0; }
