<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -40 240 220" width="240" height="220" class="cm-root" data-state="running-commands" role="img" aria-label="Running commands" shape-rendering="crispEdges"><title>Running commands</title><style>.cm-root[data-state="running-commands"] .cm-frame { opacity: 0; }
.cm-root[data-state="running-commands"] .cm-frame-0 { opacity: 1; }
.cm-root[data-state="running-commands"] .cm-frame-0 { animation: cm-running-commands-0 calc(1.6s * var(--cm-tempo, 1)) steps(1, end) var(--cm-repeat, infinite) both; }
@keyframes cm-running-commands-0 { 0% { opacity: 1; } 12.5% { opacity: 0; } 50% { opacity: 1; } 62.5% { opacity: 0; } 100% { opacity: 0; } }
