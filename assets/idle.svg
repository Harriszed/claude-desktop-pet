<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -40 240 220" width="240" height="220" class="cm-root" data-state="idle" role="img" aria-label="Idle" shape-rendering="crispEdges"><title>Idle</title><style>.cm-root[data-state="idle"] .cm-frame { opacity: 0; }
.cm-root[data-state="idle"] .cm-frame-0 { opacity: 1; }
.cm-root[data-state="idle"] .cm-frame-0 { animation: cm-idle-0 calc(4.8s * var(--cm-tempo, 1)) steps(1, end) var(--cm-repeat, infinite) both; }
@keyframes cm-idle-0 { 0% { opacity: 1; } 42.708333% { opacity: 0; } 45.416667% { opacity: 1; } 100% { opacity: 1; } }
.cm-root[data-state="idle"] .cm-frame-1 { animation: cm-idle-1 calc(4.8s * var(--cm-tempo, 1)) steps(1, end) var(--cm-repeat, infinite) both; }
@keyframes cm-idle-1 { 0% { opacity: 0; } 42.708333% { opacity: 1; } 45.416667% { opacity: 0; } 100% { opacity: 0; } }
.cm-root[data-paused="true"] .cm-frame { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .cm-root[data-state="idle"] .cm-frame { animation: none !important; } }
